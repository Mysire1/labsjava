apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: library
  labels:
    app.kubernetes.io/name: library
    app.kubernetes.io/part-of: library
data:
  APP_URL: http://library.local
  KEYCLOAK_URL: http://keycloak.local
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library
  LOGGING_LEVEL_ROOT: INFO
