{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library.fullname" . }}-secret
  labels:
    {{- include "library.labels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret is required" .Values.secrets.oidcClientSecret | quote }}
{{- end }}
