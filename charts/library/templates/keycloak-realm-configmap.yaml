apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "library.componentName" (dict "root" . "component" "keycloak") }}-realm
  labels:
    {{- include "library.labels" (dict "root" . "component" "keycloak") | nindent 4 }}
data:
  library-realm.json: |
    {{- tpl (.Files.Get "files/library-realm.json") . | nindent 4 }}
