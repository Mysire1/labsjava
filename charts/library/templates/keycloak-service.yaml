apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.componentName" (dict "root" . "component" "keycloak") }}
  labels:
    {{- include "library.labels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "library.selectorLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
