{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library.componentName" (dict "root" . "component" "keycloak") }}-secret
  labels:
    {{- include "library.labels" (dict "root" . "component" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUsername | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.adminPassword is required" .Values.keycloak.adminPassword | quote }}
  LIBRARY_USER_PASSWORD: {{ required "secrets.userPassword is required" .Values.secrets.userPassword | quote }}
  LIBRARY_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
{{- end }}
