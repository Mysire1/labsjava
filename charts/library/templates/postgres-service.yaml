apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "library.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "library.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
