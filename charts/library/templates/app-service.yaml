apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.fullname" . }}
  labels:
    {{- include "library.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "library.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
