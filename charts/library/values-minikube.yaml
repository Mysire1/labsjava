# Values used by Argo CD (argocd-apps/library.yaml) on minikube.
# Secrets are NOT in Git: create them once with bootstrap/create-secrets.sh.

replicaCount: 2

image:
  tag: "1.1.0"
  # CI builds amd64 only; on Apple Silicon minikube use the arm64 image loaded with "minikube image load"
  pullPolicy: IfNotPresent

config:
  appUrl: http://library.local
  logLevel: INFO

ingress:
  enabled: true
  host: library.local

secrets:
  create: false
  oidcClientSecret: ""
  userPassword: ""
  adminPassword: ""

postgres:
  password: ""

keycloak:
  adminPassword: ""

imagePullSecrets:
  - name: ghcr-pull
