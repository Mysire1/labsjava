spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=library
spring.datasource.password=library
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:${keycloak.url}}
keycloak.realm-url=${keycloak.url}/realms/library
keycloak.internal-realm-url=${keycloak.internal-url}/realms/library
keycloak.logout-url=${keycloak.realm-url}/protocol/openid-connect/logout?client_id=library-app&post_logout_redirect_uri=http://localhost:8080/

spring.security.oauth2.client.registration.keycloak.client-id=library-app
spring.security.oauth2.client.registration.keycloak.client-secret=library-secret
#spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.realm-url}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.internal-realm-url}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.internal-realm-url}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.internal-realm-url}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.realm-url}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.internal-realm-url}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
